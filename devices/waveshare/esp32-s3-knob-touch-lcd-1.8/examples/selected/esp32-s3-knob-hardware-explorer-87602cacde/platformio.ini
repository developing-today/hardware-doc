; ─────────────────────────────────────────────────────────────────────────────
;  Test App for Waveshare ESP32-Knob — PlatformIO Configuration
;  Target:  Waveshare ESP32-S3-Knob-Touch-LCD-1.8
;  MCU:     ESP32-S3-WROOM-2  (N16R8 → 16MB Flash, 8MB PSRAM Octal)
; ─────────────────────────────────────────────────────────────────────────────

[platformio]
default_envs   = waveshare_knob_18
src_dir        = src
include_dir    = include
lib_dir        = lib
boards_dir     = boards          ; eigene Board-Definitionen unter ./boards/

[env:waveshare_knob_18]
; ─── Plattform: pioarduino (Community-Fork) ────────────────────────────────
; PlatformIO offiziell unterstützt nur Arduino-ESP32 2.x (max. Core 2.0.17),
; das hat noch kein ESP_I2S.h. Für die neuen ESP32-Arduino-3.x APIs nutzen
; wir den pioarduino-Fork — der De-facto-Standard 2025/2026.
;   Doku: https://github.com/pioarduino/platform-espressif32
;   Versionsliste: https://github.com/sivar2311/platform-espressif32-versions
platform       = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework      = arduino

; ─── Custom Board: Waveshare Knob 1.8 mit N16R8 ────────────────────────────
; Verweist auf ./boards/waveshare_knob_18.json (16MB Flash QIO, 8MB PSRAM OPI)
board          = waveshare_knob_18

; ── Build Flags ──
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_ARDUHAL_LOG_COLORS=1
    ; LVGL: lv_conf.h liegt unter ./include/ (siehe lib_archive)
    -DLV_CONF_INCLUDE_SIMPLE
    -I include
    ; LVGL braucht Zugriff auf den Heap mit PSRAM (8MB Octal verfuegbar)
    -DBOARD_HAS_PSRAM

; ── Serial / Upload ──
; Das Waveshare Knob hat eine USB-C Buchse mit CH334 USB-Hub dahinter,
; an dem ZWEI USB-Devices haengen: CH343 UART und nativer ESP32-S3 USB-OTG.
; Stecker-Orientierung bestimmt, welches aktiv ist!
;
; Wenn upload fehlschlaegt mit "This chip is ESP32, not ESP32-S3":
;   → USB-C Stecker UMDREHEN!  (CH334 routet je nach Polung anders)
;
; Wichtig: PIO Auto-Detect schnappt sich oft den UART-Port (usbserial-*),
; der aber zum falschen Chip fuehrt. Mit der Wildcard usbmodem*
; expandiert PIO auf den nativen S3-USB-Port (suffix wechselt: 22101/222201).
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
monitor_port    = /dev/cu.usbmodem*
upload_speed    = 115200

; ── Bibliotheken ──
lib_deps =
    lvgl/lvgl @ ^9.2.0
    moononournation/GFX Library for Arduino @ ^1.6.0
;    bxparks/AceButton @ ^1.10.1   ; aktivieren, wenn Encoder-Button kommt
